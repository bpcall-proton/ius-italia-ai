name: Build Windows
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Server locale (PyInstaller)
        working-directory: backend
        run: |
          pip install -r requirements-dev.txt pyinstaller
          pytest -q
          pyinstaller --onefile --noconsole --name ius_server --collect-submodules app --collect-submodules uvicorn --add-data "app/migrations;app/migrations" ius_server.py
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: desktop/package-lock.json }
      - name: App desktop
        working-directory: desktop
        run: |
          npm ci
          npm test
          npm run desktop:dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: IUS-Italia-AI-windows
          path: |
            desktop/release/*.exe
            desktop/release/*.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env: { GH_TOKEN: '${{ github.token }}' }
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" desktop/release/*.exe desktop/release/*.zip \
            --title "IUS Italia AI $GITHUB_REF_NAME" \
            --notes "Build Windows x64. Modalita dimostrativa (AI simulata, dati demo)."
